    <!-- Global Vite HMR WebSocket connection handler & error suppressor in Cloud Run / iFrame container -->
    <script>
      (function() {
        // 1. Return a silent mock WebSocket for vite-hmr requests so no connection failure occurs
        var NativeWebSocket = window.WebSocket;
        if (NativeWebSocket) {
          window.WebSocket = function(url, protocols) {
            var isVite = (protocols === 'vite-hmr') ||
                         (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1) ||
                         (typeof url === 'string' && (url.indexOf('vite-hmr') !== -1 || url.indexOf('/@vite') !== -1));
            if (isVite) {
              return {
                binaryType: 'blob',
                bufferedAmount: 0,
                extensions: '',
                protocol: 'vite-hmr',
                readyState: 3, // CLOSED
                url: String(url),
                send: function() {},
                close: function() {},
                addEventListener: function() {},
                removeEventListener: function() {},
                dispatchEvent: function() { return false; },
                onopen: null,
                onclose: null,
                onerror: null,
                onmessage: null,
              };
            }
            return new NativeWebSocket(url, protocols);
          };
          window.WebSocket.prototype = NativeWebSocket.prototype;
          window.WebSocket.CONNECTING = NativeWebSocket.CONNECTING;
          window.WebSocket.OPEN = NativeWebSocket.OPEN;
          window.WebSocket.CLOSING = NativeWebSocket.CLOSING;
          window.WebSocket.CLOSED = NativeWebSocket.CLOSED;
        }

        // 2. Intercept console.error and console.warn for Vite WebSocket messages
        var origError = console.error;
        var origWarn = console.warn;
        function isViteWsMsg(args) {
          if (!args || !args.length) return false;
          for (var i = 0; i < args.length; i++) {
            var val = args[i];
            var str = val && (val.message || val.stack || (typeof val === 'string' ? val : String(val)));
            if (str && (
              str.indexOf('WebSocket') !== -1 ||
              str.indexOf('websocket') !== -1 ||
              str.indexOf('[vite]') !== -1 ||
              str.indexOf('ws:') !== -1
            )) {
              return true;
            }
          }
          return false;
        }
        console.error = function() {
          if (isViteWsMsg(arguments)) return;
          return origError.apply(console, arguments);
        };
        console.warn = function() {
          if (isViteWsMsg(arguments)) return;
          return origWarn.apply(console, arguments);
        };

        // 3. Catch window unhandled errors and rejections
        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && event.reason;
          var msg = reason ? (reason.message || String(reason)) : '';
          if (msg && (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1 || msg.indexOf('[vite]') !== -1)) {
            event.preventDefault();
            event.stopImmediatePropagation && event.stopImmediatePropagation();
            return false;
          }
        }, true);
        window.addEventListener('error', function(event) {
          var msg = event ? (event.message || '') : '';
          if (msg && (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1 || msg.indexOf('[vite]') !== -1)) {
            event.preventDefault();
            event.stopImmediatePropagation && event.stopImmediatePropagation();
            return false;
          }
        }, true);
      })();
    </script>
